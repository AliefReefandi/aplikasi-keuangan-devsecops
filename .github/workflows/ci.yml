
name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - feature-step6-10
      - feature-step1-5
      - feature-security-hardening

  pull_request:
    branches:
      - feature-step6-10
      - feature-step1-5
      - feature-security-hardening

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-and-test:
    name: Security Scan and Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit pytest

      - name: Bandit Security Scan
        run: |
          bandit -r app.py database.py init_db.py

      - name: Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

      - name: Run Automated Tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: |
          python -m pytest -v

  docker-build:
    name: Docker Build and Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t finance-tracker:ci .

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finance-tracker:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL