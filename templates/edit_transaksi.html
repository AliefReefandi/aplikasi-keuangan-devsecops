<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaksi</title>
</head>
<body>

    <h1>Edit Transaksi</h1>

    <form method="POST">

        <label for="jenis">Jenis Transaksi:</label>
        <select name="jenis" id="jenis" required>
            <option value="pemasukan"
                {% if transaksi.jenis == "pemasukan" %}selected{% endif %}>
                Pemasukan
            </option>

            <option value="pengeluaran"
                {% if transaksi.jenis == "pengeluaran" %}selected{% endif %}>
                Pengeluaran
            </option>
        </select>

        <br><br>

        <label for="nominal">Nominal:</label>
        <input
            type="number"
            name="nominal"
            id="nominal"
            min="1"
            value="{{ transaksi.nominal }}"
            required
        >

        <br><br>

        <label for="kategori">Kategori:</label>
        <input
            type="text"
            name="kategori"
            id="kategori"
            value="{{ transaksi.kategori }}"
            required
        >

        <br><br>

        <label for="deskripsi">Deskripsi:</label>
        <textarea
            name="deskripsi"
            id="deskripsi"
        >{{ transaksi.deskripsi }}</textarea>

        <br><br>

        <label for="tanggal">Tanggal:</label>
        <input
            type="date"
            name="tanggal"
            id="tanggal"
            value="{{ transaksi.tanggal }}"
            required
        >

        <br><br>

        <button type="submit">Simpan Perubahan</button>

    </form>

    <br>

    <a href="{{ url_for('riwayat') }}">Kembali ke Riwayat</a>

</body>
</html>
