
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      # 127.0.0.1 (TCP), bukan localhost (socket): socket sudah aktif sebelum
      # MySQL membuka port 3306, sehingga db-init bisa konek terlalu cepat.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:
    build: .
    restart: "no"
    command: ["python", "init_db.py"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
  app:
    image: ${APP_IMAGE:-catatuang-app:v1.0.0-security-monitoring}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLASK_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${MYSQL_APP_USER}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      # Port metrics Prometheus, hanya di jaringan internal (tidak di-publish ke host).
      METRICS_PORT: "9200"
    ports:
      - "127.0.0.1:5000:5000"
    expose:
      - "9200"
    volumes:
      - app_logs:/app/logs
    networks:
      - frontend
      - backend
      - monitoring
    depends_on:
      db-init:
        condition: service_completed_successfully
  loki-init:
    image: busybox:1.36
    user: "0"
    command:
      - sh
      - -c
      - mkdir -p /loki/chunks /loki/rules && chown -R 10001:10001 /loki
    volumes:
      - loki_data:/loki
    restart: "no"
  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring
    depends_on:
      loki-init:
        condition: service_completed_successfully
  alloy:
    image: grafana/alloy@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - app_logs:/var/log/app:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - monitoring
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: Grafana CatatUang
      GF_SMTP_STARTTLS_POLICY: Mandatory
      # Penerima alert email; dibaca oleh provisioning/alerting/contact-points.yml.
      # Default example.com hanya agar provisioning tidak gagal jika belum diisi di .env.
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-alert@example.com}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - frontend
      - monitoring
    depends_on:
      - loki
      - prometheus
volumes:
  db_data:
  app_logs:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge
    internal: true
